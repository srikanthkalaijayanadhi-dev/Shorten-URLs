<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SnipAd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/supabase.js"></script>
    <script src="assets/main.js"></script>
</head>
<body class="flex flex-col">

<header>
    <div class="navbar-inner">
        <div style="display:flex;align-items:center;gap:0.75rem;">
            <a href="index.html" class="navbar-logo">⚡ SnipAd</a>
            <span class="badge badge-danger" style="font-size:0.7rem;">ADMIN</span>
        </div>
        <div class="navbar-links">
            <button id="theme-toggle" class="btn btn-secondary" style="font-size:0.9rem;padding:0.6rem 1rem;">Dark Mode</button>
            <a href="dashboard.html" class="btn btn-secondary" style="font-size:0.9rem;padding:0.6rem 1rem;">Dashboard</a>
        </div>
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
    </div>
    <div class="mobile-menu" id="mobile-menu">
        <a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
        <a href="index.html" class="btn btn-secondary">Home</a>
        <button id="theme-toggle-mobile" class="btn btn-secondary">Dark Mode</button>
    </div>
</header>

<main class="flex-1" style="padding:1.25rem;max-width:1200px;margin:0 auto;width:100%;">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;">
        <h1 style="font-size:clamp(1.4rem,4vw,1.875rem);font-weight:800;">
            <span class="text-primary">Admin</span> Panel
        </h1>
    </div>

    <div id="loading" style="text-align:center;padding:3rem;color:var(--secondary-color);">Loading admin data...</div>

    <div id="admin-content" class="hidden" style="display:none;">
        <!-- Tabs - horizontal scroll on mobile -->
        <div class="admin-tabs mb-4">
            <button onclick="switchTab('users')" id="tab-users" class="tab-btn active">👥 Users</button>
            <button onclick="switchTab('links')" id="tab-links" class="tab-btn">🔗 Links</button>
            <button onclick="switchTab('payouts')" id="tab-payouts" class="tab-btn">💰 Payouts</button>
        </div>

        <!-- Content -->
        <div class="card" style="min-height:400px;">

            <!-- Users -->
            <div id="view-users" class="admin-view">
                <h2 class="font-bold mb-4" style="font-size:1.1rem;">Registered Users</h2>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Email / ID</th><th>Role</th><th>Earnings</th></tr></thead>
                        <tbody id="admin-users-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- Links -->
            <div id="view-links" class="admin-view hidden">
                <h2 class="font-bold mb-4" style="font-size:1.1rem;">All Links</h2>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Code</th><th>Original URL</th><th>Clicks</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody id="admin-links-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- Payouts -->
            <div id="view-payouts" class="admin-view hidden">
                <h2 class="font-bold mb-4" style="font-size:1.1rem;">Payout Requests</h2>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>User</th><th>Amount</th><th>Method</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="admin-payouts-list"></tbody>
                    </table>
                </div>
                <div id="no-payouts-msg" class="text-center py-8 text-secondary hidden">No payout requests found.</div>
            </div>

        </div>
    </div>
</main>

<footer>
    <div class="footer-inner text-secondary text-sm">
        <div>&copy; 2026 SnipAd. All rights reserved.</div>
    </div>
</footer>

<script>
let usersData = [], linksData = [], payoutsData = [];

document.addEventListener('DOMContentLoaded', async () => {
    try {
        await fetchGlobalData();
        document.getElementById('loading').classList.add('hidden');
        const ac = document.getElementById('admin-content');
        ac.classList.remove('hidden');
        ac.style.display = 'block';
    } catch(err) {
        document.getElementById('loading').innerText = "Error loading admin data.";
        console.error(err);
    }
});

async function fetchGlobalData() {
    const [ru, rl, rp] = await Promise.all([
        window.supabaseClient.from('profiles').select('*'),
        window.supabaseClient.from('links').select('*').order('created_at', { ascending: false }),
        window.supabaseClient.from('payouts').select('*').order('created_at', { ascending: false })
    ]);
    usersData = ru.data || [];
    linksData = rl.data || [];
    payoutsData = rp.data || [];
    renderUsers(); renderLinks(); renderPayouts();
}

function renderUsers() {
    const tbody = document.getElementById('admin-users-list');
    tbody.innerHTML = '';
    if (!usersData.length) { tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--secondary-color);">No users yet.</td></tr>'; return; }
    usersData.forEach(u => {
        tbody.innerHTML += `<tr>
            <td class="font-medium text-primary truncate" style="max-width:150px;" title="${u.email || u.id}">${u.email || u.id.substring(0,12) + '...'}</td>
            <td><span class="badge ${u.role === 'admin' ? 'badge-danger' : 'badge-success'}">${u.role || 'user'}</span></td>
            <td class="font-bold">$${u.total_earnings || '0.00'}</td>
        </tr>`;
    });
}

function renderLinks() {
    const tbody = document.getElementById('admin-links-list');
    tbody.innerHTML = '';
    if (!linksData.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--secondary-color);">No links yet.</td></tr>'; return; }
    linksData.forEach(l => {
        tbody.innerHTML += `<tr>
            <td class="font-medium" style="font-family:monospace;">${l.short_code}</td>
            <td class="truncate text-secondary" style="max-width:140px;" title="${l.original_url}">${l.original_url}</td>
            <td>${l.clicks || 0}</td>
            <td><span class="badge ${l.status === 'banned' ? 'badge-danger' : 'badge-success'}">${l.status}</span></td>
            <td><button onclick="toggleBan('${l.id}','${l.status}')" class="btn btn-secondary" style="padding:0.35rem 0.75rem;font-size:0.8rem;">${l.status === 'active' ? 'Ban' : 'Unban'}</button></td>
        </tr>`;
    });
}

function renderPayouts() {
    const tbody = document.getElementById('admin-payouts-list');
    tbody.innerHTML = '';
    if (!payoutsData.length) {
        document.getElementById('no-payouts-msg').classList.remove('hidden');
        return;
    }
    payoutsData.forEach(p => {
        tbody.innerHTML += `<tr>
            <td class="truncate" style="max-width:120px;" title="${p.user_id}">${(p.user_id || '').substring(0, 10)}...</td>
            <td class="font-bold text-success">$${p.amount}</td>
            <td class="uppercase">${p.method}</td>
            <td><span class="badge ${p.status === 'pending' ? 'badge-danger' : 'badge-success'}">${p.status}</span></td>
            <td style="display:flex;gap:0.4rem;">
                ${p.status === 'pending' ? `
                <button onclick="updatePayout('${p.id}','approved')" class="btn btn-secondary" style="padding:0.3rem 0.65rem;font-size:0.8rem;color:var(--success-color);">✓</button>
                <button onclick="updatePayout('${p.id}','rejected')" class="btn btn-secondary" style="padding:0.3rem 0.65rem;font-size:0.8rem;color:var(--danger-color);">✗</button>
                ` : '-'}
            </td>
        </tr>`;
    });
}

function switchTab(tabName) {
    document.querySelectorAll('.admin-view').forEach(el => el.classList.add('hidden'));
    document.getElementById('view-' + tabName).classList.remove('hidden');
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tabName).classList.add('active');
}

async function toggleBan(linkId, currentStatus) {
    const newStatus = currentStatus === 'active' ? 'banned' : 'active';
    await window.supabaseClient.from('links').update({ status: newStatus }).eq('id', linkId);
    await fetchGlobalData();
}

async function updatePayout(id, newStatus) {
    await window.supabaseClient.from('payouts').update({ status: newStatus }).eq('id', id);
    await fetchGlobalData();
}
</script>

</body>
</html>
